version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: sentinelrag-postgres
    command: postgres -c max_connections=300 -c shared_buffers=512MB -c work_mem=16MB
    environment:
      POSTGRES_USER: sentinel
      POSTGRES_PASSWORD: sentinelpassword
      POSTGRES_DB: sentinelrag
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinel -d sentinelrag"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: sentinelrag-redis
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"

  api:
    build: .
    container_name: sentinelrag-api
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "4"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      DATABASE_URL: postgresql://sentinel:sentinelpassword@postgres:5432/sentinelrag
      REDIS_URL: redis://redis:6379/0
      DB_POOL_SIZE: 50
      DB_MAX_OVERFLOW: 100
      ENABLE_RESPONSE_CACHE: "true"
      RATE_LIMIT_PER_MINUTE: 120
      ASYNC_AUDIT_LOGGING: "true"
      EMBEDDING_MODEL: BAAI/bge-small-en-v1.5
      LLM_PROVIDER: mock
    ports:
      - "8000:8000"
    volumes:
      - ./app:/app/app
      - ./eval:/app/eval
      - ./ui:/app/ui

volumes:
  pgdata:
