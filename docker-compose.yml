version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: sentinelrag-postgres
    environment:
      POSTGRES_USER: sentinel
      POSTGRES_PASSWORD: sentinelpassword
      POSTGRES_DB: sentinelrag
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinel -d sentinelrag"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: sentinelrag-redis
    ports:
      - "6379:6379"

  api:
    build: .
    container_name: sentinelrag-api
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      DATABASE_URL: postgresql://sentinel:sentinelpassword@postgres:5432/sentinelrag
      REDIS_URL: redis://redis:6379/0
      EMBEDDING_MODEL: BAAI/bge-small-en-v1.5
      LLM_PROVIDER: mock
    ports:
      - "8000:8000"
    volumes:
      - ./app:/app/app
      - ./eval:/app/eval
      - ./ui:/app/ui

volumes:
  pgdata:
