name: SentinelRAG CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test-and-verify:
    name: Security, Quality & Load Benchmarks
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pytest Test Suite (27/27 Tests)
        env:
          PYTHONPATH: .
        run: |
          python -m pytest tests/ -v

      - name: Run Red-Team Security Suite (S1–S10 Zero-Leakage Guarantee)
        env:
          PYTHONPATH: .
        run: |
          python -m eval.run_security

      - name: Run Retrieval Quality & Ablation Benchmarks
        env:
          PYTHONPATH: .
        run: |
          python -m eval.run_quality

      - name: Run 1,000 Concurrent User Load Test
        env:
          PYTHONPATH: .
        run: |
          python -m eval.load_test_1k

      - name: Upload Load Benchmark Report
        uses: actions/upload-artifact@v4
        with:
          name: load-test-report
          path: load_test_report.md
