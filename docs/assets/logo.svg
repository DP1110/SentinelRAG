<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#0b1120" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Outer Shield Gradient (Electric Cyan to Blue) -->
    <linearGradient id="outerShieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#0ea5e9" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>

    <!-- Inner Shield Gradient (Emerald to Cyan) -->
    <linearGradient id="innerShieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <!-- Core Glow Gradient -->
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="60%" stop-color="#0284c7" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0" />
    </radialGradient>

    <!-- Subtle Border Stroke -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.1" />
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="shieldShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#0284c7" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Container Box with Rounded Corners -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="3" />

  <!-- Background Ambient Glow -->
  <circle cx="256" cy="245" r="170" fill="url(#coreGlow)" />

  <!-- Neural Mesh / Knowledge Graph Vector Lattice (Background) -->
  <g stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.22" fill="none">
    <line x1="256" y1="120" x2="180" y2="190" />
    <line x1="256" y1="120" x2="332" y2="190" />
    <line x1="180" y1="190" x2="180" y2="290" />
    <line x1="332" y1="190" x2="332" y2="290" />
    <line x1="180" y1="290" x2="256" y2="370" />
    <line x1="332" y1="290" x2="256" y2="370" />
    <line x1="180" y1="190" x2="332" y2="190" />
    <line x1="180" y1="290" x2="332" y2="290" />
    <line x1="256" y1="120" x2="256" y2="370" />
  </g>

  <!-- Layer 1: Outer Security Shield (Retrieval-time SQL pushdown gate) -->
  <path d="M 256 95 
           C 335 125, 395 135, 405 210 
           C 415 310, 340 375, 256 425 
           C 172 375, 97 310, 107 210 
           C 117 135, 177 125, 256 95 Z" 
        fill="none" 
        stroke="url(#outerShieldGrad)" 
        stroke-width="14" 
        stroke-linejoin="round"
        filter="url(#shieldShadow)" />

  <!-- Layer 2: Inner Authorization Shield (Answer-time fresh ACL verification) -->
  <path d="M 256 145 
           C 310 170, 345 178, 355 230 
           C 362 295, 310 340, 256 380 
           C 202 340, 150 295, 157 230 
           C 167 178, 202 170, 256 145 Z" 
        fill="url(#innerShieldGrad)" 
        fill-opacity="0.12"
        stroke="url(#innerShieldGrad)" 
        stroke-width="8" 
        stroke-linejoin="round" />

  <!-- Neural Vector Graph Data Nodes -->
  <g fill="#38bdf8">
    <circle cx="180" cy="190" r="5" />
    <circle cx="332" cy="190" r="5" />
    <circle cx="180" cy="290" r="5" />
    <circle cx="332" cy="290" r="5" />
  </g>

  <!-- Centerpiece: Cryptographic Keyhole & AI Vector Core -->
  <!-- Upper Keyhole Circle / Vector Node -->
  <circle cx="256" cy="235" r="24" fill="#f8fafc" filter="url(#neonGlow)" />
  <circle cx="256" cy="235" r="14" fill="#0f172a" />
  
  <!-- Lower Keyhole Taper / Access Channel -->
  <path d="M 248 245 L 244 285 L 268 285 L 264 245 Z" fill="#f8fafc" />

  <!-- Horizontal Dual-Scan Beam (Active Verification Indicator) -->
  <line x1="160" y1="235" x2="352" y2="235" stroke="#38bdf8" stroke-width="2.5" stroke-dasharray="4 8" stroke-opacity="0.8" />
  
  <!-- Radiating Pulse Rings -->
  <circle cx="256" cy="235" r="48" fill="none" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.4" stroke-dasharray="6 6" />
</svg>
